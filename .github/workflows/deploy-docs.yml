name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "database/**"
      - "resources/js/**"
      - "docs/page/**"

jobs:
  deploy-doctum:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Check if app/ or database/ changed
      - name: Check for PHP changes
        id: php_changed
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^(app/|database/)')
          echo "CHANGED=$CHANGED" >> $GITHUB_ENV

      # 3️⃣ Skip job if no PHP changes
      - name: Skip if no PHP changes
        if: env.CHANGED == ''
        run: echo "No PHP/backend changes detected, skipping Doctum docs." && exit 0

      # 4️⃣ Set up PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, xml, curl, json

      # 5️⃣ Install PHP dependencies via Composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # 6️⃣ Download Doctum PHAR
      - name: Download Doctum PHAR
        run: |
          mkdir -p deployment/doctum-temp
          curl -L https://github.com/code-lts/doctum/releases/download/5.6.0/doctum.phar -o deployment/doctum-temp/doctum.phar
          chmod +x deployment/doctum-temp/doctum.phar

      # 7️⃣ Generate Doctum documentation
      - name: Generate Doctum docs
        run: |
          # Ensure the build folder exists
          mkdir -p docs/doctum
          php deployment/doctum-temp/doctum.phar update deployment/doctum/doctum.php

      # 8️⃣ Deploy Doctum to gh-pages in a subfolder
      - name: Deploy Doctum to gh-pages
        run: |
          git fetch origin gh-pages || true
          git worktree add _gh-pages origin/gh-pages || git worktree add _gh-pages

          # Preserve other folders and clean only doctum
          rm -rf _gh-pages/doctum
          mkdir -p _gh-pages/doctum

          # Copy generated docs
          cp -r docs/doctum/* _gh-pages/doctum/ || echo "No Doctum files to copy"

          # Ensure main site page is preserved
          if [ -d "docs/page" ]; then
            mkdir -p _gh-pages/page
            cp -r docs/page/* _gh-pages/page/
          fi

          cd _gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update Doctum docs [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages

  deploy-jsdoc:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Check if resources/js changed
      - name: Check for JS changes
        id: js_changed
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^resources/js/')
          echo "CHANGED=$CHANGED" >> $GITHUB_ENV

      # 3️⃣ Skip job if no JS changes
      - name: Skip if no JS changes
        if: env.CHANGED == ''
        run: echo "No JS/frontend changes detected, skipping jsDoc." && exit 0

      # 4️⃣ Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 5️⃣ Download jsDoc CLI in a temporary folder
      - name: Download jsDoc CLI
        run: |
          mkdir -p deployment/jsdoc-temp
          npm install jsdoc --prefix deployment/jsdoc-temp

      # 6️⃣ Generate jsDoc documentation
      - name: Generate jsDoc
        run: |
          mkdir -p docs/jsdoc
          npx --prefix deployment/jsdoc-temp jsdoc -c jsdoc.json -r resources/js -d docs/jsdoc

      # 7️⃣ Deploy jsDoc to gh-pages in a subfolder
      - name: Deploy jsDoc to gh-pages
        run: |
          git fetch origin gh-pages || true
          git worktree add _gh-pages origin/gh-pages || git worktree add _gh-pages

          # Preserve other folders and clean only jsdoc
          rm -rf _gh-pages/jsdoc
          mkdir -p _gh-pages/jsdoc

          cp -r docs/jsdoc/* _gh-pages/jsdoc/ || echo "No jsDoc files to copy"

          # Ensure main site page is preserved
          if [ -d "docs/page" ]; then
            mkdir -p _gh-pages/page
            cp -r docs/page/* _gh-pages/page/
          fi

          cd _gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update jsDoc [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
