name: Deploy Doctum Docs

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "database/**"

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, xml, curl, json

      # 3️⃣ Install project dependencies (Laravel)
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # 4️⃣ Download Doctum PHAR
      - name: Download Doctum PHAR
        run: |
          mkdir -p deployment/doctum-temp
          curl -L https://github.com/code-lts/doctum/releases/download/5.6.0/doctum.phar -o deployment/doctum-temp/doctum.phar
          chmod +x deployment/doctum-temp/doctum.phar

      # 5️⃣ Generate Doctum documentation
      - name: Generate Doctum docs
        run: |
          php deployment/doctum-temp/doctum.phar update deployment/doctum/doctum.php

      # 6️⃣ Prepare gh-pages branch in a separate worktree
      - name: Prepare gh-pages branch
        run: |
          git fetch origin gh-pages || true
          git worktree add _gh-pages origin/gh-pages || git worktree add _gh-pages

      # 7️⃣ Copy generated docs to gh-pages
      - name: Copy docs to gh-pages
        run: |
          rm -rf _gh-pages/*
          cp -r docs/doctum/* _gh-pages/

      # 8️⃣ Commit and push to gh-pages
      - name: Commit and push
        run: |
          cd _gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update Doctum documentation [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
